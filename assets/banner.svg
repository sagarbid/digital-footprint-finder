<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Digital Footprint Finder</title>
  <desc id="d">Banner showing a network of connected nodes converging on a single detection point.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 80H1280M0 160H1280M0 240H1280"/>
    <path d="M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
  </g>

  <!-- network motif -->
  <g transform="translate(900 0)">
    <circle cx="190" cy="160" r="120" fill="url(#glow)"/>
    <g stroke="url(#accent)" stroke-width="1.6" stroke-opacity="0.7" fill="none">
      <path d="M20 60L190 160M60 250L190 160M130 30L190 160M340 70L190 160M330 250L190 160M250 290L190 160M20 60L130 30M340 70L250 20"/>
    </g>
    <g fill="#0b1220" stroke="url(#accent)" stroke-width="2">
      <circle cx="20" cy="60" r="7"/>
      <circle cx="60" cy="250" r="7"/>
      <circle cx="130" cy="30" r="7"/>
      <circle cx="340" cy="70" r="7"/>
      <circle cx="330" cy="250" r="7"/>
      <circle cx="250" cy="290" r="7"/>
      <circle cx="250" cy="20" r="7"/>
    </g>
    <circle cx="190" cy="160" r="16" fill="#22d3ee"/>
    <circle cx="190" cy="160" r="30" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="190" cy="160" r="46" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.3"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="140" font-size="58" font-weight="700" fill="#f8fafc">Digital Footprint</text>
    <text x="72" y="208" font-size="58" font-weight="700" fill="url(#accent)">Finder</text>
    <text x="72" y="256" font-size="22" fill="#94a3b8">OSINT · Breach monitoring · Diff engine · Splunk-ready events</text>
  </g>
</svg>
